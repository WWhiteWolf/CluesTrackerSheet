<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clues Tracker Sheet engine tests</title>
<style>
  body { font-family: Georgia, serif; background: #1a1410; color: #f0e8d8;
         max-width: 720px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 1.15rem; color: #e8b060; }
  .test { padding: 4px 0; font-size: 0.95rem; }
  .pass::before { content: '✓ '; color: #60e090; font-weight: bold; }
  .fail::before { content: '✗ '; color: #e06060; font-weight: bold; }
  .fail { color: #e06060; }
  .why { color: #a89878; font-size: 0.85rem; padding-left: 20px; }
  #summary { margin-top: 16px; font-weight: bold; font-size: 1.05rem; }
</style>
</head>
<body>
<h1>Clues Tracker Sheet engine tests</h1>
<div id="results"></div>
<div id="summary"></div>

<script src="clues-tracker-engine.js"></script>
<script>
'use strict';

// ── Tiny test runner ────────────────────────────────────────
// test() runs one test and records pass or fail; results render
// on the page and print to the console, so the same file serves
// a browser and a command-line runner.
const results = [];
function test(name, fn) {
  try { fn(); results.push({ name, ok: true }); }
  catch (e) { results.push({ name, ok: false, why: e.message }); }
}
function assert(cond, why) { if (!cond) throw new Error(why); }

// Tests save under their own keys — the app's real saves are untouched
const TEST_KEY = 'mctsGameTest';
const DECK_TEST_KEY = 'mctsDecksTest';
Engine.testing.useStorageKey(TEST_KEY);
Engine.testing.useDeckKey(DECK_TEST_KEY);

// Every test starts from a small three-seat scenario: Me in seat
// 0, Ann and Bob beside, the default 27-card deck
function scenario() {
  Engine.connect({});
  Engine.testing.reset({
    players: ['', 'Ann', 'Bob', '', '', ''],
    meSlot: 0,
    activePlayers: [0, 1, 2],
    gameInProgress: true
  });
}
function cellOf(card, col) {
  const s = Engine.inspect();
  return (s.cellState[card] && s.cellState[card][col]) || [];
}
function count(list, type) { return list.filter(m => m.type === type).length; }

// ── Landing rules ───────────────────────────────────────────

test('A ✓ lands once ever in a cell', () => {
  scenario();
  assert(Engine.testing.placeMark('Card 1', 1, 'check') === true, 'first ✓ refused');
  assert(Engine.testing.placeMark('Card 1', 1, 'check') === false, 'second ✓ accepted');
  assert(count(cellOf('Card 1', 1), 'check') === 1, 'cell should hold one ✓');
});

test('An ✗ lands once ever in a cell', () => {
  scenario();
  assert(Engine.testing.placeMark('Card 2', 1, 'cross') === true, 'first ✗ refused');
  assert(Engine.testing.placeMark('Card 2', 1, 'cross') === false, 'second ✗ accepted');
  assert(count(cellOf('Card 2', 1), 'cross') === 1, 'cell should hold one ✗');
});

test('A ! lands once ever in a cell', () => {
  scenario();
  assert(Engine.testing.placeMark('Card 3', 1, 'showed') === true, 'first ! refused');
  assert(Engine.testing.placeMark('Card 3', 1, 'showed') === false, 'second ! accepted');
  assert(count(cellOf('Card 3', 1), 'showed') === 1, 'cell should hold one !');
});

test('A ! refuses a cell holding a ✓', () => {
  scenario();
  Engine.testing.placeMark('Card 4', 1, 'check');
  assert(Engine.testing.placeMark('Card 4', 1, 'showed') === false, '! accepted on a ✓ cell');
  assert(count(cellOf('Card 4', 1), 'showed') === 0, 'the refused ! was stored');
});

test('A ! refuses a cell holding an ✗', () => {
  scenario();
  Engine.testing.placeMark('Card 5', 1, 'cross');
  assert(Engine.testing.placeMark('Card 5', 1, 'showed') === false, '! accepted on an ✗ cell');
  assert(count(cellOf('Card 5', 1), 'showed') === 0, 'the refused ! was stored');
});

test('A ? lands once per turn, and again next turn', () => {
  scenario();
  assert(Engine.testing.placeMark('Card 6', 1, 'asked') === true, 'first ? refused');
  assert(Engine.testing.placeMark('Card 6', 1, 'asked') === false, 'same-turn ? accepted');
  Engine.testing.setTurn(2);
  assert(Engine.testing.placeMark('Card 6', 1, 'asked') === true, 'next-turn ? refused');
  assert(count(cellOf('Card 6', 1), 'asked') === 2, 'cell should hold two ? marks');
});

test('A Me mark lands once per turn', () => {
  scenario();
  assert(Engine.testing.placeMark('Card 7', 1, 'ishowed') === true, 'first Me refused');
  assert(Engine.testing.placeMark('Card 7', 1, 'ishowed') === false, 'same-turn Me accepted');
});

// ── Hidden marks and their return ───────────────────────────

test('An ✗ arriving on a ! hides it but keeps it stored', () => {
  scenario();
  Engine.testing.placeMark('Card 8', 1, 'showed');
  Engine.testing.setTurn(2);
  Engine.testing.placeMark('Card 8', 1, 'cross');
  const shown = Engine.visibleMarks('Card 8', 1);
  assert(shown.length === 1 && shown[0].type === 'cross', 'display should show only the ✗');
  assert(count(cellOf('Card 8', 1), 'showed') === 1, 'the hidden ! left storage');
});

test('Wiping the ✗ brings the hidden ! back into view', () => {
  scenario();
  Engine.testing.placeMark('Card 9', 1, 'showed');
  Engine.testing.setTurn(2);
  Engine.testing.placeMark('Card 9', 1, 'cross');
  Engine.testing.wipeTurn(2);
  const shown = Engine.visibleMarks('Card 9', 1);
  assert(shown.length === 1 && shown[0].type === 'showed', 'the ! should be visible again');
});

test('A ✓ arriving on a ? leaves the ? in view', () => {
  scenario();
  Engine.testing.placeMark('Card 10', 1, 'asked');
  Engine.testing.setTurn(2);
  Engine.testing.placeMark('Card 10', 1, 'check');
  const shown = Engine.visibleMarks('Card 10', 1);
  assert(shown.some(m => m.type === 'check'), 'the ✓ is missing');
  assert(shown.some(m => m.type === 'asked'), 'the ? was hidden');
});

test('An ✗ arriving on a ? leaves the ? in view', () => {
  scenario();
  Engine.testing.placeMark('Card 11', 1, 'asked');
  Engine.testing.setTurn(2);
  Engine.testing.placeMark('Card 11', 1, 'cross');
  const shown = Engine.visibleMarks('Card 11', 1);
  assert(shown.some(m => m.type === 'cross'), 'the ✗ is missing');
  assert(shown.some(m => m.type === 'asked'), 'the ? was hidden');
});

// ── The ✓'s automatic crosses ───────────────────────────────

test('A ✓ crosses the card off for every other active player', () => {
  scenario();
  Engine.testing.placeMark('Card 12', 1, 'check');
  assert(count(cellOf('Card 12', 0), 'cross') === 1, 'Me should have the auto-✗');
  assert(count(cellOf('Card 12', 2), 'cross') === 1, 'Bob should have the auto-✗');
  assert(cellOf('Card 12', 3).length === 0, 'an empty seat got a mark');
});

test('The auto-✗ never doubles an existing ✗', () => {
  scenario();
  Engine.testing.placeMark('Card 13', 2, 'cross');
  Engine.testing.placeMark('Card 13', 1, 'check');
  assert(count(cellOf('Card 13', 2), 'cross') === 1, 'Bob should still have one ✗');
});

// ── Turn wipes ──────────────────────────────────────────────

test('A turn wipe removes only that turn\'s marks', () => {
  scenario();
  Engine.testing.placeMark('Card 14', 1, 'asked');
  Engine.testing.setTurn(2);
  Engine.testing.placeMark('Card 14', 1, 'asked');
  Engine.testing.wipeTurn(2);
  const cell = cellOf('Card 14', 1);
  assert(count(cell, 'asked') === 1 && cell[0].turn === 1, 'only the turn-1 ? should remain');
});

test('Quit-flagged marks survive a turn wipe', () => {
  scenario();
  Engine.testing.placeMark('Card 15', 1, 'check', { quit: true });
  Engine.testing.wipeTurn(1);
  assert(count(cellOf('Card 15', 1), 'check') === 1, 'the quit ✓ was wiped');
  assert(count(cellOf('Card 15', 0), 'cross') === 1, 'the quit auto-✗ on Me was wiped');
  assert(count(cellOf('Card 15', 2), 'cross') === 1, 'the quit auto-✗ on Bob was wiped');
});

test('A wiped turn takes its 🏠 marks with it', () => {
  scenario();
  Engine.testing.reset({
    players: ['', 'Ann', 'Bob', '', '', ''],
    meSlot: 0,
    activePlayers: [0, 1, 2],
    gameInProgress: true,
    houseChecked: { 'Card 16': 2, 'Card 17': 1 }
  });
  Engine.testing.wipeTurn(2);
  const s = Engine.inspect();
  assert(s.houseChecked['Card 16'] === undefined, 'the turn-2 🏠 mark should be gone');
  assert(s.houseChecked['Card 17'] === 1, 'the turn-1 🏠 mark should remain');
});

// ── Hooks ───────────────────────────────────────────────────

test('cellChanged reports every repainted cell', () => {
  scenario();
  const calls = [];
  Engine.connect({ cellChanged: (card, col) => calls.push(card + '/' + col) });
  Engine.testing.placeMark('Card 18', 1, 'check');
  Engine.connect({});
  assert(calls.includes('Card 18/1'), 'the ✓ cell was not reported');
  assert(calls.includes('Card 18/0'), 'the auto-✗ on Me was not reported');
  assert(calls.includes('Card 18/2'), 'the auto-✗ on Bob was not reported');
});

test('A missing hook is quietly skipped', () => {
  scenario();
  Engine.connect({});
  assert(Engine.testing.placeMark('Card 19', 1, 'check') === true, 'placing failed with no hooks');
});

// ── The snapshot ────────────────────────────────────────────

test('The snapshot round-trips: reset saves, boot restores', () => {
  scenario();
  Engine.testing.reset({
    players: ['', 'Ann', 'Bob', '', '', ''],
    meSlot: 0,
    activePlayers: [0, 1, 2],
    gameInProgress: true,
    turnCount: 7
  });
  Engine.testing.placeMark('Card 20', 1, 'check');   // unsaved change after the save
  Engine.boot();
  const s = Engine.inspect();
  assert(s.turnCount === 7, 'the saved turn count did not come back');
  assert(s.players[1] === 'Ann', 'the saved players did not come back');
  assert(!s.cellState['Card 20'], 'an unsaved mark survived the boot');
});

test('Booting with no saved record leaves state alone', () => {
  scenario();
  localStorage.removeItem(TEST_KEY);
  Engine.boot();
  const s = Engine.inspect();
  assert(s.players[1] === 'Ann', 'boot with nothing saved changed the state');
});

test('visibleMarks hands out copies, not the stored marks', () => {
  scenario();
  Engine.testing.placeMark('Card 21', 1, 'showed');
  const shown = Engine.visibleMarks('Card 21', 1);
  shown[0].type = 'check';
  assert(cellOf('Card 21', 1)[0].type === 'showed', 'a caller changed the stored mark');
});

// ── The asking flow ─────────────────────────────────────────
// The scenario's deck: Card 1–9 in Category 1, Card 10–18 in
// Category 2, Card 19–27 in Category 3. Me (seat 0) holds the
// first turn.

function catchStatus() {
  const seen = [];
  Engine.connect({ status: (text, kind) => seen.push({ text, kind }) });
  return seen;
}

test('An asking tap places a ? and records the pick', () => {
  scenario();
  assert(Engine.cellTap('Card 1', 0) === true, 'the tap was not consumed');
  const s = Engine.inspect();
  assert(s.pendingCards.includes('Card 1'), 'the pick was not recorded');
  assert(count(cellOf('Card 1', 0), 'asked') === 1, 'no ? landed');
});

test('A second tap on the picked card takes it back', () => {
  scenario();
  Engine.cellTap('Card 1', 0);
  Engine.cellTap('Card 1', 0);
  const s = Engine.inspect();
  assert(s.pendingCards.length === 0, 'the pick was not taken back');
  assert(count(cellOf('Card 1', 0), 'asked') === 0, 'the ? was not removed');
});

test('A second pick in one category swaps the pick', () => {
  scenario();
  Engine.cellTap('Card 1', 0);
  Engine.cellTap('Card 2', 0);
  const s = Engine.inspect();
  assert(s.pendingCards.length === 1 && s.pendingCards[0] === 'Card 2',
    'the picks did not swap');
  assert(count(cellOf('Card 1', 0), 'asked') === 0, 'the old ? stayed');
  assert(count(cellOf('Card 2', 0), 'asked') === 1, 'the new ? is missing');
});

test('The last pick swings the gate to the showing phase', () => {
  scenario();
  Engine.cellTap('Card 1', 0);
  Engine.cellTap('Card 10', 0);
  Engine.cellTap('Card 19', 0);
  const s = Engine.inspect();
  assert(s.gamePhase === 'showing', 'the gate did not swing');
  assert(s.pendingAskerCol === 0, 'the asker was not recorded');
});

test('The progress message names the missing categories', () => {
  scenario();
  const seen = catchStatus();
  Engine.cellTap('Card 1', 0);
  const msg = seen[seen.length - 1];
  assert(msg && msg.text.includes('1/3'), 'no progress count spoken');
  assert(msg.text.includes('Category 2') && msg.text.includes('Category 3'),
    'the missing categories were not named');
});

test('After the gate, a tap on an asked cell takes back the pick and the gate', () => {
  scenario();
  Engine.cellTap('Card 1', 0);
  Engine.cellTap('Card 10', 0);
  Engine.cellTap('Card 19', 0);
  assert(Engine.cellTap('Card 19', 0) === true, 'the take-back tap was not consumed');
  const s = Engine.inspect();
  assert(s.gamePhase === 'asking', 'the phase did not reopen');
  assert(s.pendingAskerCol === -1, 'the asker record was not cleared');
  assert(!s.pendingCards.includes('Card 19'), 'the pick was not taken back');
  assert(s.pendingCards.length === 2, 'the other picks did not stay');
  assert(count(cellOf('Card 19', 0), 'asked') === 0, 'the taken-back ? stayed');
});

test('The take-back road closes once the shower moment passes', () => {
  scenario();
  Engine.testing.reset({
    players: ['', 'Ann', 'Bob', '', '', ''], meSlot: 0,
    activePlayers: [0, 1, 2], gameInProgress: true,
    gamePhase: 'waiting'
  });
  assert(Engine.cellTap('Card 1', 0) === false, 'a waiting-phase tap was consumed');
});

test("A tap outside the asker's column goes to the note road", () => {
  scenario();
  assert(Engine.cellTap('Card 1', 1) === false, "a tap in Ann's column was consumed");
});

test('A tap on an empty seat does nothing', () => {
  scenario();
  assert(Engine.cellTap('Card 1', 3) === true, 'an empty-seat tap reached the note road');
  assert(cellOf('Card 1', 3).length === 0, 'an empty seat got a mark');
});

// ── Next ────────────────────────────────────────────────────

test('Next with no picks logs a pass and advances', () => {
  scenario();
  Engine.nextTap();
  const s = Engine.inspect();
  assert(s.turnCount === 2, 'the turn did not advance');
  const entry = s.turnLog[s.turnLog.length - 1];
  assert(entry.type === 'pass' && entry.player === 'Me', 'no pass entry logged');
});

test('Next refuses a half-made ask', () => {
  scenario();
  Engine.cellTap('Card 1', 0);
  const seen = catchStatus();
  Engine.nextTap();
  const s = Engine.inspect();
  assert(s.turnCount === 1, 'the turn advanced past a half-made ask');
  assert(s.pendingCards.length === 1, 'the pick did not stay');
  const msg = seen[seen.length - 1];
  assert(msg && msg.kind === 'warning' && msg.text.includes('all or none of the cards'),
    'no refusal spoken');
});

test('Next in the waiting phase advances the turn', () => {
  Engine.testing.reset({
    players: ['', 'Ann', 'Bob', '', '', ''], meSlot: 0,
    activePlayers: [0, 1, 2], gameInProgress: true,
    gamePhase: 'waiting', lastShowerName: 'Ann'
  });
  Engine.nextTap();
  const s = Engine.inspect();
  assert(s.turnCount === 2 && s.gamePhase === 'asking', 'the turn did not advance');
  assert(s.lastShowerName === '', "the shower's name was not cleared");
});

test('Advancing skips a 😢 player', () => {
  Engine.testing.reset({
    players: ['', 'Ann', 'Bob', '', '', ''], meSlot: 0,
    activePlayers: [0, 1, 2], gameInProgress: true,
    playerOutKind: { 1: 'wrongacc' }
  });
  Engine.nextTap();
  assert(Engine.inspect().turnStep === 2, 'the turn landed on the 😢 player');
});

// ── Undo ────────────────────────────────────────────────────

test("Undo at the game's start refuses", () => {
  scenario();
  const seen = catchStatus();
  Engine.undoTap();
  const s = Engine.inspect();
  assert(s.turnCount === 1, 'the turn moved');
  assert(!s.turnLog.some(e => e.type === 'undo'), 'an undo entry was logged');
  const msg = seen[seen.length - 1];
  assert(msg && msg.text === 'Nothing to undo', 'no refusal spoken');
});

test('Undo mid-ask wipes the picks and stays on the turn', () => {
  scenario();
  Engine.cellTap('Card 1', 0);
  Engine.undoTap();
  const s = Engine.inspect();
  assert(s.turnCount === 1, 'the turn moved');
  assert(s.pendingCards.length === 0, 'the picks were not cleared');
  assert(count(cellOf('Card 1', 0), 'asked') === 0, 'the ? was not wiped');
  assert(s.turnLog[s.turnLog.length - 1].type === 'undo', 'no undo entry logged');
});

test("Undo at a turn's start steps back and wipes that turn", () => {
  scenario();
  Engine.testing.placeMark('Card 5', 1, 'asked');
  Engine.nextTap();
  Engine.undoTap();
  const s = Engine.inspect();
  assert(s.turnCount === 1 && s.turnStep === 0, 'the step back went wrong');
  assert(cellOf('Card 5', 1).length === 0, "the previous turn's mark stayed");
});

test('Undo stepping back skips a 😢 player', () => {
  Engine.testing.reset({
    players: ['', 'Ann', 'Bob', '', '', ''], meSlot: 0,
    activePlayers: [0, 1, 2], gameInProgress: true,
    playerOutKind: { 1: 'wrongacc' }, turnCount: 2, turnStep: 2
  });
  Engine.undoTap();
  const s = Engine.inspect();
  assert(s.turnCount === 1, 'the turn did not step back');
  assert(s.turnStep === 0, 'the step back landed on the 😢 player');
});

test('An undo that uncovers a hidden ! records the return', () => {
  Engine.testing.reset({
    players: ['', 'Ann', 'Bob', '', '', ''], meSlot: 0,
    activePlayers: [0, 1, 2], gameInProgress: true,
    turnCount: 2, gamePhase: 'waiting',
    cellState: { 'Card 6': { 1: [
      { type: 'showed', turn: 1 }, { type: 'cross', turn: 2 }
    ] } }
  });
  Engine.undoTap();
  const s = Engine.inspect();
  const entry = s.turnLog[s.turnLog.length - 1];
  assert(entry.type === 'undo', 'no undo entry logged');
  assert(entry.returned.length === 1 &&
    entry.returned[0].card === 'Card 6' &&
    entry.returned[0].col === 1 &&
    entry.returned[0].type === 'showed', 'the ! return was not recorded');
  const shown = Engine.visibleMarks('Card 6', 1);
  assert(shown.length === 1 && shown[0].type === 'showed', 'the ! is not back in view');
});

test('An undo never records a ? return — the ? was never hidden', () => {
  Engine.testing.reset({
    players: ['', 'Ann', 'Bob', '', '', ''], meSlot: 0,
    activePlayers: [0, 1, 2], gameInProgress: true,
    turnCount: 2, gamePhase: 'waiting',
    cellState: { 'Card 7': { 1: [
      { type: 'asked', turn: 1 }, { type: 'check', turn: 2 }
    ] } }
  });
  Engine.undoTap();
  const s = Engine.inspect();
  const entry = s.turnLog[s.turnLog.length - 1];
  assert(entry.type === 'undo', 'no undo entry logged');
  assert(entry.returned.length === 0, 'a return was recorded for a visible ?');
  const shown = Engine.visibleMarks('Card 7', 1);
  assert(shown.length === 1 && shown[0].type === 'asked', 'the ? is not standing alone');
});

test('Every action refuses at game over', () => {
  Engine.testing.reset({
    players: ['', 'Ann', 'Bob', '', '', ''], meSlot: 0,
    activePlayers: [0, 1, 2], gameInProgress: true,
    accusationResult: 'won', turnCount: 5
  });
  const seen = catchStatus();
  assert(Engine.cellTap('Card 1', 0) === true, 'a game-over tap reached the note road');
  Engine.nextTap();
  Engine.undoTap();
  const s = Engine.inspect();
  assert(s.turnCount === 5, 'the turn moved at game over');
  assert(!s.turnLog.some(e => e.type === 'undo'), 'an undo ran at game over');
  assert(seen.length === 3 &&
    seen.every(m => m.text.includes('Game over')), 'the guard did not speak each time');
});

// ── The showing flow ────────────────────────────────────────

function fullAsk() {
  Engine.cellTap('Card 1', 0);
  Engine.cellTap('Card 10', 0);
  Engine.cellTap('Card 19', 0);
}

test('A header tap during asking is refused with the asker named', () => {
  scenario();
  const seen = catchStatus();
  const r = Engine.headerTap(1);
  assert(r.road === 'refused', 'the tap was not refused');
  const msg = seen[seen.length - 1];
  assert(msg && msg.text.includes('your column'), "the asker's column was not named");
});

test('The asker cannot also show', () => {
  scenario();
  fullAsk();
  const seen = catchStatus();
  assert(Engine.headerTap(0).road === 'refused', 'the asker was allowed to show');
  assert(seen[seen.length - 1].text.includes('cannot also show'), 'no refusal spoken');
});

test('A player with ❌ on every asked card cannot show', () => {
  scenario();
  ['Card 1', 'Card 10', 'Card 19'].forEach(c => Engine.testing.placeMark(c, 1, 'cross'));
  fullAsk();
  const seen = catchStatus();
  assert(Engine.headerTap(1).road === 'refused', 'a fully ❌-ed player was allowed');
  assert(seen[seen.length - 1].text.includes('cannot show'), 'no refusal spoken');
});

// A show between two other players needs Me out of the walk:
// four seats, Ann asking, so Bob can pass and Cid can show.
function fourSeats() {
  Engine.connect({});
  Engine.testing.reset({
    players: ['', 'Ann', 'Bob', 'Cid', '', ''], meSlot: 0,
    activePlayers: [0, 1, 2, 3], gameInProgress: true, turnStep: 1
  });
}
function annAsks() {
  Engine.cellTap('Card 1', 1);
  Engine.cellTap('Card 10', 1);
  Engine.cellTap('Card 19', 1);
}

test('A third-party show lands ! marks and ❌-s the passers', () => {
  fourSeats();
  annAsks();
  const r = Engine.headerTap(3);
  assert(r.road === 'marked', 'the show did not commit');
  ['Card 1', 'Card 10', 'Card 19'].forEach(c => {
    assert(count(cellOf(c, 3), 'showed') === 1, `no ! on Cid for ${c}`);
    assert(count(cellOf(c, 2), 'cross') === 1, `the passer Bob kept ${c}`);
    assert(count(cellOf(c, 0), 'cross') === 0, 'Me was walked past');
  });
  const s = Engine.inspect();
  assert(s.gamePhase === 'waiting', 'the phase did not move on');
  const entry = s.turnLog[s.turnLog.length - 1];
  assert(entry.type === 'turn' && entry.shower === 'Cid' && entry.result === 'showed',
    'the turn was not logged');
});

test('A must-show player blocks those after them', () => {
  fourSeats();
  Engine.testing.placeMark('Card 1', 2, 'check');
  annAsks();
  const seen = catchStatus();
  assert(Engine.headerTap(3).road === 'refused', 'a blocked shower was allowed');
  assert(seen[seen.length - 1].text.includes('must show first'), 'no refusal spoken');
  assert(Engine.headerTap(2).road === 'marked', 'the must-show player was refused');
});

test('Showing to me opens the shown-to-me road with the right cards', () => {
  Engine.testing.reset({
    players: ['', 'Ann', 'Bob', '', '', ''], meSlot: 0,
    activePlayers: [0, 1, 2], gameInProgress: true,
    myCards: ['Card 1']
  });
  fullAsk();
  const r = Engine.headerTap(1);
  assert(r.road === 'shownme', 'the shown-to-me road did not open');
  assert(r.cards.length === 2 && r.cards[0] === 'Card 10' && r.cards[1] === 'Card 19',
    'the offered cards are wrong');
  assert(Engine.inspect().gamePhase === 'showing', 'the road committed early');
  assert(count(cellOf('Card 10', 1), 'check') === 0, 'a mark landed before the confirm');
});

test('Confirming shown-to-me lands the ✓ in the shower\'s column', () => {
  Engine.testing.reset({
    players: ['', 'Ann', 'Bob', '', '', ''], meSlot: 0,
    activePlayers: [0, 1, 2], gameInProgress: true,
    myCards: ['Card 1']
  });
  fullAsk();

test('The 🏠 tap marks the board card and crosses the other players', () => {
  scenario();
  const seen = catchStatus();
  assert(Engine.houseTap('Card 1') === true, 'the tap was refused');
  const s = Engine.inspect();
  assert(s.houseChecked['Card 1'] === 1, 'the mark did not land');
  [1, 2].forEach(col => {
    const cell = cellOf('Card 1', col);
    assert(count(cell, 'cross') === 1 && cell[0].house === true,
      `no house ✗ on seat ${col}`);
  });
  assert(cellOf('Card 1', 0).length === 0,
    'Me was crossed — the Me column already handles unheld cards');
  assert(cellOf('Card 1', 3).length === 0, 'an empty seat got a mark');
  const e = s.turnLog[s.turnLog.length - 1];
  assert(e.type === 'house' && e.card === 'Card 1', 'the mark was not logged');
  assert(seen[seen.length - 1].text === 'Card 1 is on the board',
    'the status is wrong');
});

test('A second tap clears the mark, exactly its crosses, and its entry', () => {

  assert(!s.turnLog.some(e => e.type === 'house'), 'the same-turn entry stayed');
  assert(seen[seen.length - 1].text === 'Card 3 board mark cleared',
    'the status is wrong');
});

    { name: 'Category 1', cards: ['C1', 'C2', 'C3', 'C4'] },
    { name: 'Category 2', cards: ['C5', 'C6', 'C7'] },
    { name: 'Category 3', cards: ['C8', 'C9', 'C10'] }
  ] });   // 10 cards, 3 aside — 7 over three seats, uneven
  const d = Engine.countsDefault();
  assert(d !== null, 'no default was offered');
  assert(d.house === 1, 'the leftover did not go to House: ' + d.house);
  assert(d.players.join(',') === '2,2,2,0,0,0',
    'the shares are wrong: ' + d.players.join(','));
});

test('The even split deals the remainder from the first seat on', () => {
  setupScenario();   // 27 cards, 3 aside — 24 dealt, three seats
  assert(Engine.countsPrefill(3).join(',') === '7,7,7,0,0,0',
    'the even case is wrong: ' + Engine.countsPrefill(3).join(','));
  assert(Engine.countsPrefill(4).join(',') === '7,7,6,0,0,0',
    'the remainder case is wrong: ' + Engine.countsPrefill(4).join(','));
});

test('A mismatched Done is refused with the settled line', () => {
  setupScenario();
  const seen = catchStatus();
  assert(Engine.setCounts(3, [8, 8, 7, 0, 0, 0]) === false,
    'an overfull entry was accepted');
  assert(seen[seen.length - 1].text ===
    'The number of cards entered does not equal the number of cards in your deck',
    'the line is wrong: ' + seen[seen.length - 1].text);
  assert(Engine.inspect().counts.entered === false, 'the counts entered anyway');
});

test('A matching Done enters the counts', () => {
  setupScenario();
  assert(Engine.setCounts(3, [7, 7, 7, 0, 0, 0]) === true, 'the entry was refused');
  const s = Engine.inspect();
  assert(s.counts.entered === true && s.counts.house === 3 &&
    s.counts.players[2] === 7, 'the counts did not land');
});

test('Counts offered for empty seats are ignored', () => {
  setupScenario();
  assert(Engine.setCounts(3, [7, 7, 7, 0, 5, 0]) === true,
    'the junk seat blocked the entry');
  assert(Engine.inspect().counts.players[4] === 0, 'an empty seat kept a count');
});

// ── Setup — the Play gate ───────────────────────────────────

test('The gate asks for Me first', () => {
  Engine.connect({});
  Engine.testing.reset({});
  assert(Engine.setupUnmet() === 'You need to mark one of the seats as Me before you can play',
    'wrong: ' + Engine.setupUnmet());
});

test('Then a second player', () => {
  Engine.connect({});
  Engine.testing.reset({ meSlot: 0 });
  assert(Engine.setupUnmet() === 'You need to have at least two players, counting yourself',
    'wrong: ' + Engine.setupUnmet());
});

test('Then 2 categories with cards', () => {
  setupScenario({ categories: [{ name: 'Only', cards: ['A', 'B', 'C'] }] });
  assert(Engine.setupUnmet() === 'You need to have at least two categories with cards in them',
    'wrong: ' + Engine.setupUnmet());
});

test('Then 3 cards in every filled category', () => {
  setupScenario({ categories: [
    { name: 'Full', cards: ['A', 'B', 'C'] },
    { name: 'Thin', cards: ['D', 'E'] }
  ] });
  assert(Engine.setupUnmet() === 'You need to have at least three cards in Thin',
    'wrong: ' + Engine.setupUnmet());
});

test('Then 12 cards in the deck', () => {
  setupScenario({ categories: [
    { name: 'One', cards: ['A', 'B', 'C', 'D', 'E'] },
    { name: 'Two', cards: ['F', 'G', 'H', 'I', 'J'] }
  ] });
  assert(Engine.setupUnmet() === 'You need to have at least twelve cards in your deck',
    'wrong: ' + Engine.setupUnmet());
});

test('Then the counts', () => {
  setupScenario();
  assert(Engine.setupUnmet() ===
    'You need to enter the card counts — tap "Where are the cards?"',
    'wrong: ' + Engine.setupUnmet());
});

test('Then the hand matching the count', () => {
  setupScenario({ counts: enteredCounts(),
    myCards: ['Card 1', 'Card 2', 'Card 3'] });
  assert(Engine.setupUnmet() ===
    'You need to tap 7 cards as yours — you have tapped 3',
    'wrong: ' + Engine.setupUnmet());
});

test('A complete Setup passes the gate', () => {
  setupScenario({ counts: enteredCounts(),
    myCards: ['Card 1', 'Card 2', 'Card 3', 'Card 4',
              'Card 5', 'Card 6', 'Card 7'] });
  assert(Engine.setupUnmet() === null, 'the gate still speaks: ' + Engine.setupUnmet());
});

// ── Setup — Play ────────────────────────────────────────────

function completeSetup(extra) {
  setupScenario(Object.assign({
    counts: enteredCounts(),
    myCards: ['Card 1', 'Card 2', 'Card 3', 'Card 4',
              'Card 5', 'Card 6', 'Card 7']
  }, extra || {}));
}

test('Play refuses with the first unmet condition spoken', () => {
  Engine.connect({});
  Engine.testing.reset({});
  const seen = catchStatus();
  assert(Engine.play() === false, 'an empty Setup started a game');
  assert(seen[seen.length - 1].text === 'You need to mark one of the seats as Me before you can play' &&
    seen[seen.length - 1].kind === 'warning', 'the gate did not speak');
  assert(Engine.inspect().gameInProgress === false, 'the game started anyway');
});

test('Play lays the turn-zero marks and opens turn 1', () => {
  completeSetup();
  assert(Engine.play() === true, 'a complete Setup was refused');
  const s = Engine.inspect();
  assert(s.gameInProgress === true && s.turnCount === 1 &&
    s.gamePhase === 'asking' && s.turnStep === 0, 'the game did not open right');
  assert(s.activePlayers.join(',') === '0,1,2', 'the ring is wrong');
  const held = cellOf('Card 1', 0);
  assert(count(held, 'check') === 1 && held[0].turn === 0,
    'no turn-zero ✓ on a held card');
  assert(count(cellOf('Card 1', 1), 'cross') === 1,
    'the held ✓ did not cross Ann off');
  assert(count(cellOf('Card 9', 0), 'cross') === 1,
    'no ✗ on an unheld card in the Me column');
  assert(count(cellOf('Card 9', 1), 'cross') === 0,
    'an unheld card marked another player');
});

test('Play drops the empty categories', () => {
  completeSetup();
  Engine.addCategory();                      // the counts clear with it
  Engine.setCounts(3, [7, 7, 7, 0, 0, 0]);   // entered afresh
  Engine.play();
  assert(Engine.inspect().categories.length === 3, 'the empty category stayed');
});

test('A second Play is refused', () => {
  completeSetup();
  Engine.play();
  assert(Engine.play() === false, 'a running game was restarted');
});

// ── Setup — saved decks ─────────────────────────────────────

function clearDecks() { localStorage.removeItem(DECK_TEST_KEY); }

test('A deck saves by name, capped at 6 characters', () => {
  setupScenario();
  clearDecks();
  assert(Engine.saveDeck('Classic') === true, 'the save was refused');
  const decks = Engine.savedDecks();
  assert(decks.length === 1 && decks[0].name === 'Classi',
    'the deck did not save right');
  assert(decks[0].categories.length === 3 &&
    decks[0].categories[0].cards.length === 9, 'the structure was not kept');
});

test('A fifth deck is refused', () => {
  setupScenario();
  clearDecks();
  ['One', 'Two', 'Three', 'Four'].forEach(n => Engine.saveDeck(n));
  const seen = catchStatus();
  assert(Engine.saveDeck('Five') === false, 'a fifth deck was accepted');
  assert(seen[seen.length - 1].text === 'Maximum 4 saved decks — delete one first',
    'no refusal spoken');
});

test('A doubled deck name is refused', () => {
  setupScenario();
  clearDecks();
  Engine.saveDeck('Mine');
  const seen = catchStatus();
  assert(Engine.saveDeck('mine') === false, 'the doubled name was accepted');
  assert(seen[seen.length - 1].text === 'That name is already used',
    'no refusal spoken');
});

test('An empty deck name is refused', () => {
  setupScenario();
  clearDecks();
  const seen = catchStatus();
  assert(Engine.saveDeck('   ') === false, 'a blank name was accepted');
  assert(seen[seen.length - 1].text === 'Enter a deck name first',
    'no refusal spoken');
});

test('Loading a deck replaces the structure and clears the hand and counts', () => {
  setupScenario({ categories: [
    { name: 'Rooms', cards: ['Hall', 'Study', 'Attic'] },
    { name: 'Tools', cards: ['Rope', 'Pipe', 'Wrench'] }
  ] });
  clearDecks();
  Engine.saveDeck('Rooms');
  setupScenario({ myCards: ['Card 1'], counts: enteredCounts() });
  assert(Engine.loadDeck(0) === true, 'the load was refused');
  const s = Engine.inspect();
  assert(s.categories.length === 2 && s.categories[0].name === 'Rooms',
    'the structure did not come back');
  assert(s.myCards.length === 0, 'the hand stayed');
  assert(s.counts.entered === false, 'the counts stood');
});

test('Deleting a deck removes it', () => {
  setupScenario();
  clearDecks();
  Engine.saveDeck('One');
  Engine.saveDeck('Two');
  assert(Engine.deleteDeck(0) === true, 'the delete was refused');
  const decks = Engine.savedDecks();
  assert(decks.length === 1 && decks[0].name === 'Two', 'the wrong deck left');
});

test('The saved decks survive a New Game', () => {
  setupScenario();
  clearDecks();
  Engine.saveDeck('Keeper');
  Engine.newGame(false, false);
  assert(Engine.savedDecks().length === 1, 'a New Game touched the saved decks');
});

// ── Setup — the hook ────────────────────────────────────────

test('setupChanged reports a Setup edit', () => {
  Engine.testing.reset({});
  let calls = 0;
  Engine.connect({ setupChanged: () => calls++ });
  Engine.setSeat(1, 'Ann', false);
  Engine.connect({});
  assert(calls > 0, 'the hook never fired');
});

// ── Results ─────────────────────────────────────────────────
if (typeof localStorage !== 'undefined') {
  localStorage.removeItem(TEST_KEY);
  localStorage.removeItem(DECK_TEST_KEY);
}
const passed = results.filter(r => r.ok).length;
const summaryText = passed + ' of ' + results.length + ' tests passed' +
  (passed === results.length ? '' : ' — FAILURES ABOVE');
if (typeof document !== 'undefined') {
  const box = document.getElementById('results');
  results.forEach(r => {
    const div = document.createElement('div');
    div.className = 'test ' + (r.ok ? 'pass' : 'fail');
    div.textContent = r.name;
    box.appendChild(div);
    if (!r.ok) {
      const why = document.createElement('div');
      why.className = 'why';
      why.textContent = r.why;
      box.appendChild(why);
    }
  });
  document.getElementById('summary').textContent = summaryText;
}
results.forEach(r => console.log((r.ok ? 'PASS ' : 'FAIL ') + r.name + (r.ok ? '' : ' — ' + r.why)));
console.log(summaryText);
</script>
